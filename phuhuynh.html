<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra Cứu Kỷ Luật - Yên Khánh A</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --primary: #1e3a8a; --bg: #f1f5f9; --surface: #ffffff; --text: #1e293b; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 1rem; min-height: 100vh; }
  .container { max-width: 500px; width: 100%; margin-top: 2rem; }
  .header { text-align: center; margin-bottom: 2rem; }
  .header h1 { font-size: 1.3rem; color: var(--primary); font-weight: 700; margin-bottom: 0.5rem; }
  .header p { font-size: 0.9rem; color: #64748b; }
  .card { background: var(--surface); padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
  .form-group { margin-bottom: 1.25rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; }
  input { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; transition: 0.2s; }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,58,138,0.1); }
  .btn { width: 100%; padding: 0.85rem; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .btn:hover { background: #172554; }
  .btn:disabled { background: #94a3b8; cursor: not-allowed; }
  #resultBox { display: none; margin-top: 1.5rem; padding: 1.5rem; border-radius: 12px; border: 2px solid #e2e8f0; background: #fafafa; }
  .result-item { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px dashed #cbd5e1; }
  .result-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .res-label { font-size: 0.8rem; color: #64748b; font-weight: 600; text-transform: uppercase; }
  .res-val { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-top: 0.25rem; }
  .val-danger { color: #dc2626; }
  .val-success { color: #16a34a; }
  .res-details { font-size: 0.9rem; line-height: 1.5; color: #334155; margin-top: 0.5rem; background: #f1f5f9; padding: 0.75rem; border-radius: 8px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>CỔNG TRA CỨU KỶ LUẬT & NỀ NẾP</h1>
    <p>Dành cho Phụ huynh học sinh THPT Yên Khánh A</p>
  </div>

  <div class="card">
    <form id="searchForm" onsubmit="handleSearch(event)">
      <div class="form-group">
        <label>Mã Học Sinh (*)</label>
        <input type="text" id="studentId" placeholder="VD: 2610A099" required autocomplete="off">
      </div>
      <div class="form-group">
        <label>Mật khẩu tra cứu (Ngày sinh) (*)</label>
        <input type="text" id="studentDob" placeholder="VD: 01/01/2011" required autocomplete="off">
        <span style="font-size:0.75rem; color:#64748b; margin-top:4px; display:block;">Định dạng DD/MM/YYYY. Bao gồm cả dấu gạch chéo.</span>
      </div>
      <button type="submit" class="btn" id="btnSubmit">🔍 Tra Cứu Thông Tin</button>
    </form>
  </div>

  <div id="resultBox">
    <div class="result-item">
      <div class="res-label">Điểm rèn luyện hiện tại</div>
      <div class="res-val" id="resScore">--</div>
    </div>
    <div class="result-item">
      <div class="res-label">Xếp loại tạm tính</div>
      <div class="res-val" id="resRank">--</div>
    </div>
    <div class="result-item">
      <div class="res-label">Chi tiết vi phạm / Điểm cộng</div>
      <div class="res-details" id="resDetails">--</div>
    </div>
  </div>
</div>

<script>
// THẦY XÓA CHỮ "LINK_CSV_CUA_THAY_VAO_DAY" VÀ DÁN LINK LẤY Ở BƯỚC 3 VÀO ĐÂY (Giữ nguyên cặp dấu ngoặc kép "")
const CSV_DATA_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQNTRCwbVrhMzKjtsLCMrW863jnv_AcEx9GrcPnPb7erW2DXOgJLMDykW_pQm2kKnu9AUWh1VibAC1Z/pub?gid=1989826358&single=true&output=csv";

async function sha256Hash(text) {
  const encoder = new TextEncoder();
  const data = encoder.encode(text);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function handleSearch(e) {
  e.preventDefault();
  
  const id = document.getElementById('studentId').value.trim().toLowerCase();
  const dob = document.getElementById('studentDob').value.trim();
  const btn = document.getElementById('btnSubmit');
  const resultBox = document.getElementById('resultBox');

  if (!id || !dob) return;

  btn.innerHTML = "⏳ Đang kết nối dữ liệu...";
  btn.disabled = true;
  resultBox.style.display = 'none';

  try {
    const rawInput = (id + dob).replace(/\s/g, '');
    const userHash = await sha256Hash(rawInput);

    const response = await fetch(CSV_DATA_URL);
    if (!response.ok) throw new Error("Không thể tải dữ liệu từ máy chủ.");
    const csvText = await response.text();

    const rows = csvText.split('\n');
    let found = false;

    for (let i = 1; i < rows.length; i++) {
      const cols = rows[i].split(',');
      if (cols.length >= 4) {
        if (cols[0].trim() === userHash) {
          found = true;
          document.getElementById('resScore').textContent = cols[1].trim() + " điểm";
          
          const rank = cols[2].trim();
          const rankEl = document.getElementById('resRank');
          rankEl.textContent = rank;
          rankEl.className = (rank === 'Chưa đạt' || rank === 'Yếu' || rank === 'Không đạt') ? 'res-val val-danger' : 'res-val val-success';
          
          const rawDetails = cols.slice(3).join(',').replace(/^"|"$/g, '').trim();
          document.getElementById('resDetails').innerHTML = rawDetails.split('|').join('<br>• ');
          
          resultBox.style.display = 'block';
          break;
        }
      }
    }

    if (!found) {
      alert("❌ Thông tin không chính xác hoặc học sinh không có trong hệ thống.\nVui lòng kiểm tra lại chính xác Mã HS và Ngày sinh (DD/MM/YYYY).");
    }

  } catch (error) {
    alert("⚠️ Lỗi mạng: " + error.message);
  } finally {
    btn.innerHTML = "🔍 Tra Cứu Thông Tin";
    btn.disabled = false;
  }
}
</script>
</body>
</html>
